Global:
  seed: 42
  device: "gpu"
  label_names: ["gamma1", "gamma2"]
  output_keys: ["gamma1", "gamma2"]
  use_fp16: false
  log_interval: 10
  save_interval: 5

Model:
  __class_name__: "SolvGNN"
  __init_params__:
    in_dim: 74
    hidden_dim: 256
    n_classes: 1
    mlp_dropout_rate: 0.0
    mlp_activation: "relu"
    mpnn_activation: "relu"
    num_step_message_passing: 1
    pinn_lambda: 1.0

Loss:
  __class_name__: "GibbsDuhemLoss"
  __init_params__:
    lambda_gd: 1.0
    gd_start_epoch: 5
    loss_type: "mse"
    gd_loss_type: "mse"
    use_ln_gamma: true

Optimizer:
  __class_name__: "Adam"
  __init_params__:
    learning_rate: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0

Scheduler:
  __class_name__: "StepDecay"
  __init_params__:
    learning_rate: 0.001
    step_size: 50
    gamma: 0.5

Dataset:
  train:
    dataset:
      __class_name__: "BinaryActivityDataset"
      __init_params__:
        data_path: "train_binary.csv"
        solvent_list_path: "solvent_list.csv"
        add_self_loop: true
        preload_graphs: false
    sampler:
      __class_name__: "BatchSampler"
      __init_params__:
        batch_size: 8
        shuffle: false
        drop_last: false
    loader:
      num_workers: 0
      use_shared_memory: false
      collate_fn: "BinaryActivityCollator"

  val:
    dataset:
      __class_name__: "BinaryActivityDataset"
      __init_params__:
        data_path: "val_binary.csv"
        solvent_list_path: "solvent_list.csv"
        add_self_loop: true
        preload_graphs: false
    sampler:
      __class_name__: "BatchSampler"
      __init_params__:
        batch_size: 8
        shuffle: false
        drop_last: false
    loader:
      num_workers: 0
      use_shared_memory: false
      collate_fn: "BinaryActivityCollator"

  test:
    dataset:
      __class_name__: "BinaryActivityDataset"
      __init_params__:
        data_path: "test_binary.csv"
        solvent_list_path: "solvent_list.csv"
        add_self_loop: true
        preload_graphs: false
    sampler:
      __class_name__: "BatchSampler"
      __init_params__:
        batch_size: 8
        shuffle: false
        drop_last: false
    loader:
      num_workers: 0
      use_shared_memory: false
      collate_fn: "BinaryActivityCollator"

Train:
  epochs: 200
  clip_grad_norm: 1.0
  accumulation_steps: 1
  evaluate_interval: 1
  save_interval: 5
  log_interval: 10

Evaluator:
  __class_name__: "Evaluator"
  __init_params__:
    metrics:
      - __class_name__: "MAE"
      - __class_name__: "RMSE"
      - __class_name__: "R2"

Inference:
  batch_size: 8
